name: Landing page (ciguard.dev) deploy

# Auto-deploys the Astro landing page in `landing/` to Cloudflare Pages
# project `ciguard` on every push to main that touches the landing
# tree. Manual runs via `workflow_dispatch` for forced republishes.
#
# Required repo secrets (set once during cutover — see
# `landing/README.md`):
#   - CLOUDFLARE_API_TOKEN  — token with Pages:Edit scope (NOT a global API key)
#   - CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID (visible on dashboard home)
#
# This workflow does NOT gate the rest of the build. The engine's CI
# / CodeQL / Dogfood / Code Scanning gate are unaffected by changes
# under `landing/**`.

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/landing-deploy.yml'
      # The landing build now generates demo HTML from the engine's
      # reporters + fixtures. A reporter or rule change should refresh
      # the embedded demos so the page never drifts behind the engine.
      - 'src/ciguard/reporter/**'
      - 'src/ciguard/analyzer/**'
      - 'src/ciguard/repo_scan.py'
      # The pre-commit install tile reads `[project].version` from
      # pyproject.toml at Astro build time (landing/src/data/version.ts),
      # so a version bump must republish the landing page even when
      # nothing under landing/ itself changed.
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write   # Cloudflare wrangler-action posts a Deployment record

# Only one deploy in flight at a time — last-push-wins so a fast
# follow-up doesn't deploy a stale dist.
concurrency:
  group: landing-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Bumped from 8 → 15 to absorb the demo-build steps. Playwright
    # cold-starts Chromium (one-shot ~30s) and ciguard-from-source
    # installs ~300 MB of deps; combined slack ~5 min.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json

      # ---- Demo HTML + screenshot generation (Slice 10 session 3) ----
      # Runs BEFORE Astro build so the generated artifacts under
      # landing/public/{demos,screenshots}/ are picked up by Astro's
      # `public/` → `dist/` copy step.

      - name: Set up Python (for demo generation)
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install ciguard from source
        # Editable install of the live engine — same code that ships;
        # the demos a visitor sees match the version on PyPI/GHCR.
        working-directory: ${{ github.workspace }}
        run: pip install --upgrade pip && pip install -e .

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        # Chromium-only — we only screenshot, no Firefox/WebKit needed.
        # `--with-deps` pulls system fonts + libs the headless browser
        # requires on the GitHub-hosted Ubuntu image.
        run: npx playwright install --with-deps chromium

      - name: Generate demo HTML artifacts
        run: npm run build:demos

      - name: Generate screenshot strip
        run: npm run build:screenshots

      - name: Build static site
        run: npm run build

      - name: Verify build output
        # Sanity check before publishing. Catches the dev-server
        # / SSR / mis-configuration regression class — `dist/` MUST
        # exist + contain `index.html` for Pages to serve anything.
        # Also asserts demo artifacts were copied through Astro's
        # public/ → dist/ pipeline so the iframes don't 404.
        run: |
          test -f dist/index.html || (echo "::error::dist/index.html missing — build failed silently" && exit 1)
          test -f dist/_headers || echo "::warning::dist/_headers missing — security headers won't be served"
          test -f dist/demos/per-pipeline-bad.html || (echo "::error::demo HTML missing in dist/ — build_demos.py output not picked up" && exit 1)
          test -f dist/screenshots/per-pipeline.png || (echo "::error::screenshots missing in dist/ — Playwright output not picked up" && exit 1)
          echo "dist/ contents:"
          find dist -type f | sort

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0  # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: landing
          command: pages deploy dist --project-name=ciguard --branch=main --commit-dirty=true
