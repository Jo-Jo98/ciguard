# Demo fixture: monolith repo — single pipeline file with all CI for one
# big service. Used by ciguard.dev to contrast against the microservices
# fixture below.

stages:
  - lint
  - test
  - build
  - deploy

lint:
  stage: lint
  image: python:3.11.4-slim
  script:
    - pip install ruff
    - ruff check src/

test:
  stage: test
  image: python:3.11.4-slim
  script:
    - pip install -r requirements.txt
    - pytest --cov=src tests/

build:
  stage: build
  image: docker:25.0
  services:
    - docker:25.0-dind
  script:
    - docker build -t app:$CI_COMMIT_SHA .
    - docker push registry.example.com/app:$CI_COMMIT_SHA

deploy-staging:
  stage: deploy
  image: alpine:3.19
  script:
    - apk add --no-cache curl
    - curl -X POST https://staging.example.com/deploy/$CI_COMMIT_SHA
  environment:
    name: staging

deploy-production:
  stage: deploy
  image: alpine:3.19
  script:
    - apk add --no-cache curl
    - curl -X POST https://prod.example.com/deploy/$CI_COMMIT_SHA
  environment:
    name: production
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
