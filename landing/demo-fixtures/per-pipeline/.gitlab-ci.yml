# Demo fixture: deliberately-flawed GitLab CI pipeline — illustrates a
# realistic mid-quality pipeline an auditor would inherit. Exercises every
# major ciguard rule family so the rendered HTML deliverable shows a
# representative slice of the output. Used by ciguard.dev to demo the
# per-pipeline visualiser. NOT a real production pipeline — DO NOT COPY.

stages:
  - build
  - test
  - deploy

variables:
  AWS_ACCESS_KEY_ID: "AKIAIOSFODNN7EXAMPLE"   # SECRET-001 will fire
  DOCKER_REGISTRY: registry.example.com

build-app:
  stage: build
  image: python:3.9-slim                       # SCA-EOL fires: 3.9 nearing EOL
  script:
    - pip install -r requirements.txt
    - python setup.py sdist bdist_wheel
  artifacts:
    paths:
      - dist/

unit-tests:
  stage: test
  image: python:3.9-slim
  script:
    - pip install pytest
    - pytest tests/

integration-tests:
  stage: test
  image: docker:latest                         # SCA-PIN-002 fires: mutable tag
  services:
    - docker:dind
  script:
    - docker build -t app .
    - docker run app pytest tests/integration

deploy-staging:
  stage: deploy
  image: alpine                                # SCA-PIN-002: bare = :latest
  script:
    - apk add --no-cache curl
    - curl -X POST https://staging.example.com/deploy
    - echo "Deploying to staging"
  environment:
    name: staging

deploy-production:
  stage: deploy
  image: alpine:3.18
  script:
    - apk add --no-cache curl openssh
    - curl -X POST https://prod.example.com/deploy
  environment:
    name: production                            # No manual approval — POL-004 fires
    url: https://prod.example.com
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
